<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/styles.css" rel="stylesheet" />
    <link rel="icon" href="../img/js.png" sizes="32x32" type="image/png" />
    <title>Ejemplo 3 - Manipulación del DOM</title>
</head>

<body>
    <header class="p-3 text-bg-dark">
        <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
            <a href="../index.html" class="text-white text-decoration-none fw-semibold">Guía 7</a>
            <nav class="d-flex flex-wrap gap-2">
                <a href="../index.html" class="nav-link text-white">Inicio</a>
                <a href="ejemplo1.html" class="nav-link text-white">Ejemplo 1</a>
                <a href="ejemplo2.html" class="nav-link text-white">Ejemplo 2</a>
                <a href="ejemplo3.html" class="nav-link text-white">Ejemplo 3</a>
                <a href="ejemplo4.html" class="nav-link text-white">Ejemplo 4</a>
                <a href="ejercicio1.html" class="nav-link text-white">Ejercicio 1</a>
                <a href="ejercicio2.html" class="nav-link text-white">Ejercicio 2</a>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="mb-4">Ejemplo de ajustes visuales</h1>
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label for="idFondo" class="form-label">Color de fondo</label>
                        <input type="color" id="idFondo" class="form-control form-control-color w-100" value="#ffffff" />
                    </div>
                    <div class="col-md-4">
                        <label for="idTitulos" class="form-label">Color de títulos</label>
                        <input type="color" id="idTitulos" class="form-control form-control-color w-100" value="#000000" />
                    </div>
                    <div class="col-md-4">
                        <label for="idParrafos" class="form-label">Color de párrafos</label>
                        <input type="color" id="idParrafos" class="form-control form-control-color w-100" value="#000000" />
                    </div>
                    <div class="col-12 d-flex gap-3">
                        <button id="idBtnAumentar" type="button" class="btn btn-primary">Aumentar letra</button>
                        <button id="idBtnDisminuir" type="button" class="btn btn-outline-secondary">Disminuir letra</button>
                    </div>
                </div>

                <section class="mt-5">
                    <h2>Sección de ejemplo</h2>
                    <p>Este párrafo cambiará de color y tamaño según los controles del formulario.</p>
                    <p>La manipulación del DOM permite modificar estilos en tiempo real.</p>
                </section>
            </div>
        </div>
    </main>

    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../js/ejemplo3.js" defer></script>
</body>

</html>
