    <title>Ejercicio 2 - Catálogo de películas</title>

<body>
    <header class="p-3 text-bg-dark">
        <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">

            <nav class="d-flex flex-wrap gap-2">
                <a href="../index.html" class="nav-link text-white">Inicio</a>
                <a href="ejemplo1.html" class="nav-link text-white">Ejemplo 1</a>

            <div class="modal-content">

                    <h2 class="modal-title fs-5" id="idTituloDetalle">Detalle</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Cerrar</button>
